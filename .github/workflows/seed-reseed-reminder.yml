name: Seed reseed reminder

# The OPNsense seed (baseline.xml / seeds/*.json, rendered by the collection's
# opnsense_seed_config module) defines
# non-API-able L2/L3 config (interface assignments, WAN setup) that takes effect
# on the live FW ONLY after a reseed (#21). This guard auto-flags any PR touching
# the seed so the change is tracked on the reseed umbrella and never silently lost.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'modules/vm-opnsense/seed/**'

permissions:
  pull-requests: write
  issues: write

jobs:
  remind:
    name: Flag reseed dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- seed-reseed-reminder -->';
            const body = marker + '\n'
              + ':warning: **Reseed-dependent change.** This PR modifies the OPNsense seed '
              + '(`modules/vm-opnsense/seed/**`), which defines non-API-able L2/L3 config. '
              + 'It takes effect on the live FW **only after a reseed**. Track it on the reseed '
              + 'umbrella **#21** so the next maintenance window applies it. (Auto-labeled `needs-reseed`.)';
            await github.rest.issues.addLabels({
              owner, repo, issue_number, labels: ['needs-reseed'],
            }).catch(() => {});
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            if (comments.some((c) => c.body && c.body.includes(marker))) return;
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
